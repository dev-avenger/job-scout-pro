apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jobagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: jobagent/worker:latest
          envFrom:
            - configMapRef:
                name: jobagent-config
            - secretRef:
                name: jobagent-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
