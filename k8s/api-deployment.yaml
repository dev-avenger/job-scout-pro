apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jobagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: jobagent/api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: jobagent-config
            - secretRef:
                name: jobagent-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: jobagent
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
