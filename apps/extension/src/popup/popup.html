<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 16px; font-family: system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    button { width: 100%; padding: 10px; margin: 4px 0; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .primary { background: #3b82f6; color: white; }
    .secondary { background: #e5e7eb; color: #374151; }
    .status { font-size: 12px; color: #6b7280; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Auto Job Apply</h1>
  <button class="primary" id="saveJob">Save This Job</button>
  <button class="secondary" id="captureForm">Capture Form Fields</button>
  <button class="secondary" id="openDashboard">Open Dashboard</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
